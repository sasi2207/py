name: Deploy to py.techsasi.com via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to Subdomain via FTP
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout GitHub Repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Upload Files to cPanel Subdomain Directory using FTP (Port 21)
      - name: Sync files to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: py.techsasi.com/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/venv/**
            **/__pycache__/**
            .env.example
            README.md