name: Deploy to py.techsasi.com

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Subdomain via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to cPanel using SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        with:
          host: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22  # Hardcoded standard SSH port (change to custom port if your host uses one)
          envs: GH_PAT,DB_USER,DB_PASSWORD,DB_HOST,DB_PORT,DB_NAME,SECRET_KEY
          command_timeout: 15m
          script: |
            set -e
            echo "=== Deploying to py.techsasi.com ==="

            # 1. Target Subdomain Directory
            APP_DIR="$HOME/py.techsasi.com"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # 2. Sync Repository
            if [ -d ".git" ]; then
              if [ -n "$GH_PAT" ]; then
                git remote set-url origin https://${GH_PAT}@github.com/${{ github.repository }}.git
              fi
              git fetch origin main
              git reset --hard origin/main
            else
              git init
              if [ -n "$GH_PAT" ]; then
                git remote add origin https://${GH_PAT}@github.com/${{ github.repository }}.git
              else
                git remote add origin https://github.com/${{ github.repository }}.git
              fi
              git fetch origin main
              git reset --hard origin/main
            fi

            # 3. Generate .env File
            cat << EOF > .env
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_NAME=${DB_NAME}
            SECRET_KEY=${SECRET_KEY}
            EOF

            # 4. Activate Virtualenv & Install Requirements
            VENV_PATH=$(find $HOME/virtualenv/py.techsasi.com -name "activate" 2>/dev/null | head -n 1)

            if [ -n "$VENV_PATH" ] && [ -f "$VENV_PATH" ]; then
              echo "Activating virtualenv: $VENV_PATH"
              source "$VENV_PATH"
            else
              python3 -m venv venv
              source venv/bin/activate
            fi

            pip install --upgrade pip
            pip install a2wsgi
            pip install -r requirements.txt

            # 5. Reload Passenger
            mkdir -p tmp
            touch tmp/restart.txt

            echo "=== Deployment Completed for https://py.techsasi.com ==="